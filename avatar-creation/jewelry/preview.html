<!doctype html>
<html><head><meta charset="utf-8"><title>Jewellery preview</title>
<style>html,body{margin:0;height:100%;background:#f3f1ee}canvas{display:block}#l{position:fixed;left:12px;top:10px;font:13px system-ui;color:#333}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="l"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const url = q.get('glb'); const view = q.get('view') || 'front'; const zoom = parseFloat(q.get('zoom')||'1'); const ty = parseFloat(q.get('ty')||'0'); const tz = parseFloat(q.get('tz')||'0');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3f1ee);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.0005, 10);
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(1,2,2); scene.add(key);
new GLTFLoader().load(url, g => {
  const root = g.scene; scene.add(root);
  root.traverse(o => { if (o.isMesh && o.material && o.material.name === 'diamond') {
    o.material = new THREE.MeshPhysicalMaterial({color:0xffffff, metalness:0.05, roughness:0.0, transmission:0.55, ior:2.42, thickness:0.0015, envMapIntensity:3.0, flatShading:true, specularIntensity:1.0});
  } else if (o.isMesh && o.material) { o.material.envMapIntensity = 2.0; } });
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z); const d = r / Math.tan(THREE.MathUtils.degToRad(15)) * 0.62 * zoom; c.y += ty * s.y; c.z += tz * s.z;
  const dir = {front:[0,0,1], top:[0,1,0.001], side:[1,0,0], iso:[1,0.8,1]}[view];
  camera.position.copy(c).add(new THREE.Vector3(...dir).normalize().multiplyScalar(d)); camera.lookAt(c);
  const ctl = new OrbitControls(camera, renderer.domElement); ctl.target.copy(c);
  document.getElementById('l').textContent = url.split('/').pop() + '  ' + (s.x*1000).toFixed(1)+' x '+(s.y*1000).toFixed(1)+' x '+(s.z*1000).toFixed(1)+' mm';
  (function loop(){ ctl.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
  window.__ready = true;
});
</script></body></html>
