sim:
  config:
    optimize_storage: true

    # Run a bounded number of steps; sim auto-terminates when cloth reaches
    # static equilibrium (static_threshold + non_static_percent). 300 steps = 5s
    # at 60fps, fits the shopper-facing "watch it drape" budget.
    max_sim_steps: 300
    max_frame_time: 60
    max_meshgen_time: 60
    max_sim_time: 300
    # Auto-terminate when <2% of verts move faster than 5 cm/s.
    static_threshold: 0.05
    non_static_percent: 2.0

    # QA gates — PyGarment marks a sim as "failed" if these thresholds are
    # exceeded. We still return the result, but the failure is logged.
    max_body_collisions: 200
    max_self_collisions: 1000

    # Zero-gravity warmup: first N frames have gravity=0 — lets the cloth
    # relax into its rest pose without being yanked down. Critical when cloth
    # starts in penetration with the body (CLO3D-on-SMPL case). v19: 10 → 30
    # because v18.9 ended with 311 body collisions — 10 frames was not enough
    # for contact-only forces to push pre-penetrating verts out before gravity
    # kicked in and re-drove them inside.
    zero_gravity_steps: 30
    resolution_scale: 1.0
    # Ground plane ON: trouser hems that overshoot the feet stack on the floor.
    ground: true
    material:
      # Stretch / area stiffness (Pa-m equivalent — PyGarment uses these for
      # their XPBD cloth; values picked from their default_sim_props.yaml).
      garment_tri_ka: 10000.0
      garment_tri_ke: 10000.0
      garment_tri_kd: 1.0
      # Bending — very soft, cloth folds freely.
      garment_edge_ke: 1.0
      garment_edge_kd: 10.0
      # Structural springs (from add_cloth_mesh_sewing_spring with add_springs=True).
      spring_ke: 50000.0
      spring_kd: 10.0
      # Fabric properties.
      fabric_density: 1.0
      # Cloth thickness in meters. Used by PyGarment for the self-collision
      # bubble radius around each particle. v18 had 0.1 (10cm!) which inflated
      # every particle into a football — 1100+ persistent self-intersections
      # in v18.9 directly caused by this. 1mm is a reasonable cotton thickness
      # and drops the self-collision bubble to a realistic size.
      fabric_thickness: 0.001
      # Cloth-cloth friction coefficient. v22: 0.0 -> 0.2. The "kill it to
      # avoid freeze" comment was Newton-era; PyGarment handles friction
      # gracefully. Zero friction meant cloth slid freely with no internal
      # grip → contributed to v21's 5860 non-static verts at frame 300 (23%
      # of mesh still moving). 0.2 is moderate: cloth catches against itself
      # in folds so they stop oscillating, without causing static freeze.
      fabric_friction: 0.2
    options:
      # Self-collision: triangle-particle + edge-edge ON; particle-particle OFF
      # (expensive + not required for thin cloth).
      enable_particle_particle_collisions: false
      enable_triangle_particle_collisions: true
      enable_edge_edge_collisions: true

      # Body collision filters — requires per-vertex body segmentation. We ship
      # smpl_vert_segmentation.json, so this can be ON.
      enable_body_collision_filters: true
      enable_global_collision_filter: true

      # Velocity clamp + damping: THE explosion guards. Clamps any particle
      # velocity to 20 m/s no matter how large the contact force. Damps velocities
      # above 0 m/s at factor 0.3 (mild). Our v14/v15 hit 2780 m/s per substep —
      # this completely prevents that class of NaN.
      global_damping_factor: 0.3
      global_damping_effective_velocity: 0.0
      global_max_velocity: 20.0

      # Attachment constraint: requires PyGarment-specific panel labels
      # ('lower_interface', 'right_collar', etc.). Our CLO3D panels use
      # different names, so this is disabled for now. Can re-enable after we
      # map our panel labels to their convention.
      enable_attachment_constraint: false
      attachment_stiffness: []
      attachment_damping: []
      attachment_frames: 0
      attachment_label_names: []

      # Body-part drag: pulls each garment panel toward its assigned body part
      # (via panel_assignment's 'closest' strategy). Enabled in v18.6 because
      # without it there's nothing holding the cloth on the body — gravity
      # alone pulls the whole garment down off the avatar (exactly what we
      # saw in v18.5 screenshots). cloth_reference_k=1e7 is PyGarment's
      # canonical default; margin=0.1 is the attraction distance.
      enable_cloth_reference_drag: true
      cloth_reference_margin: 0.1
      # NOTE: YAML 1.1 requires explicit sign for scientific notation
      # (1.0e+7), not 1.0e7. Without the sign PyYAML parses it as a STRING
      # which then gets passed to a Warp kernel expecting float32 →
      # "unable to pack kernel parameter type <class 'str'> for param
      # reference_k" at frame 1 (exact bug in v18.8 log). Use the
      # unambiguous decimal form.
      cloth_reference_k: 10000000.0

      # Body smoothing: starts sim with a laplacian-smoothed body (no
      # protruding muscles/bust/belly), restores detail gradually between
      # frames 50 and 70.
      #
      # v22: back OFF. v20 turned this on to help deep-penetration verts
      # eject. It did help body_collisions modestly (300 -> 245). But v21's
      # clean sim (no orphan particles) revealed the artifact it creates on
      # the back: cloth conforms to the flattened back during frames 0-50,
      # then shoulder-blade/spine curvature pops back during detail
      # restoration, pushes cloth outward, and the sim runs out of frames
      # before cloth re-drapes — visible skin patches on upper/mid back and
      # back of thighs in v21 screenshots. Body_collision_thickness=0.015 +
      # soft_contact_ke=5000 + fabric_friction=0.2 together should cover
      # deep-penetration verts without needing the smoothing hack.
      enable_body_smoothing: false
      smoothing_total_smoothing_factor: 1.0
      smoothing_recover_start_frame: 50
      smoothing_num_steps: 20
      smoothing_frame_gap_between_steps: 1

      # Body-collision contact thickness. v20: 1cm -> 1.5cm. Conservative
      # bump — verts starting slightly inside the body now feel contact
      # force. Going further (2cm+) risks cloth floating visibly off the
      # body, especially at the neckline/waistband.
      body_collision_thickness: 0.015
      # Body-to-cloth friction. v22: 0.0 -> 0.2. With zero friction cloth
      # perpetually slides on the body under any tangential force (gravity
      # component, drag asymmetry) and never settles. Particularly visible
      # on the back, where panels have no anchor features to catch on. 0.2
      # gives the cloth enough grip to stop drifting once it lands while
      # still allowing the initial drape motion.
      body_friction: 0.2

      # Soft contact (body-cloth spring). v19: 10 → 5000.
      # The old `10.0` was a Newton-era value left behind from v15/v16
      # debugging, where we were fighting a 2780 m/s ejection NaN in the
      # Newton Style3D solver. That solver is gone. In PyGarment the
      # body-contact spring stiffness needs to actually be able to push a
      # penetrating particle OUT of the body — with ke=10, 311 verts ended up
      # stuck inside the body at end of sim (v18.9 log). 5000 is within
      # PyGarment's canonical range and the global velocity clamp
      # (global_max_velocity=20) + damping (0.3) are still active as NaN
      # guards if any single contact spikes.
      soft_contact_margin: 0.01
      soft_contact_ke: 5000.0
      soft_contact_kd: 0.0
      soft_contact_kf: 0.0
      soft_contact_mu: 0.0

      # Particle-particle contact (used when particle_particle_collisions=True).
      # Unused in our config.
      particle_ke: 100.0
      particle_kd: 0.0
      particle_kf: 0.0
      particle_mu: 0.0
      particle_cohesion: 0.0
      particle_adhesion: 0.0
  stats:
    fails: {}
    sim_time: {}
    spf: {}
    fin_frame: {}
    self_collisions: {}
    body_collisions: {}
render:
  config:
    resolution:
    - 800
    - 800
    sides:
    - front
    uv_texture: false
  stats:
    render_time: {}
