<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Find your size</title>
<!--
  Size finder: a size without an avatar. Opened in an iframe by the "Find my size" theme
  block (shopify_app/extensions/tryon-widget/blocks/find-my-size.liquid).

  The shopper answers six quick things; size-estimator.js turns them into a size for THIS
  product, with a likelihood per size. No account, no photo, no 3D garment needed.

  The card is a guest in someone else's store, so it wears the store's colours, corner radius
  and font (passed by the block) instead of bringing its own brand.

  Privacy: the answers stay in this browser (localStorage). Height, weight and age are never
  sent to the API; only the outcome is (size, likelihood, what the shopper did with it).

  Host <-> card messages (all prefixed TRYON_SIZE_ so the try-on block ignores them):
    card -> host  TRYON_SIZE_READY, TRYON_SIZE_CLOSE, TRYON_SIZE_RESULT {size, alternative},
                  TRYON_SIZE_ADD_TO_CART {size, session_id}, TRYON_SIZE_OPEN_TRYON
    host -> card  TRYON_SIZE_PRODUCT {sizes:[{label, available}], hasTryon}, TRYON_SIZE_OPEN,
                  TRYON_SIZE_HIDE
-->
<style>
  :root {
    --ink: #141414; --paper: #ffffff; --btn-bg: #141414; --btn-fg: #ffffff;
    --radius: 6px; --btn-radius: var(--radius); --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --line: color-mix(in srgb, var(--ink) 16%, transparent);
    --soft: color-mix(in srgb, var(--ink) 6%, transparent);
    --mute: color-mix(in srgb, var(--ink) 62%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body { font-family: var(--font); color: var(--ink); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; justify-content: center; }
  body.silent .scrim, body.closed .scrim { display: none; }
  /* The card scrolls inside itself, so a short screen never cuts it off. */
  .card { position: relative; width: 100%; max-width: 440px; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
          background: var(--paper); color: var(--ink); padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
          border-radius: calc(var(--radius) * 2) calc(var(--radius) * 2) 0 0; }
  @media (min-width: 560px) {
    .scrim { align-items: center; padding: 24px; }
    .card { border-radius: calc(var(--radius) * 2); max-height: calc(100dvh - 48px); padding: 28px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise .22s ease-out; }
    @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
    .tape i { transition: height .35s ease-out; }
  }
  h1 { font-size: 22px; line-height: 1.15; margin: 0 40px 4px 0; font-weight: 600; letter-spacing: -0.01em; }
  .product { margin: 0 0 18px; color: var(--mute); font-size: 14px; }
  .close { position: absolute; top: 14px; right: 12px; width: 40px; height: 40px; border: 0; background: none; color: inherit; font-size: 20px; cursor: pointer; border-radius: 50%; }
  .close:hover { background: var(--soft); }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
  legend, label.lab { display: block; padding: 0; margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .opt { font-weight: 400; color: var(--mute); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg label { position: relative; display: block; text-align: center; padding: 11px 6px; font-size: 14px; cursor: pointer; border-left: 1px solid var(--line); min-height: 44px; }
  .seg label:first-of-type { border-left: 0; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--ink); color: var(--paper); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: -4px; }
  .seg label:has(input:checked):has(input:focus-visible) { outline-color: var(--paper); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .field { position: relative; }
  .field input { width: 100%; height: 46px; padding: 0 38px 0 12px; font: inherit; font-size: 16px; color: inherit; background: transparent;
                 border: 1px solid var(--line); border-radius: var(--radius); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input:focus-visible, .primary:focus-visible, .link:focus-visible, .close:focus-visible, .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .field .unit { position: absolute; right: 12px; top: 0; line-height: 46px; color: var(--mute); font-size: 13px; pointer-events: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .units { display: flex; justify-content: flex-end; margin: -8px 0 12px; }
  .link { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 13px; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .primary { display: block; width: 100%; min-height: 50px; padding: 12px 16px; border: 0; border-radius: var(--btn-radius); background: var(--btn-bg); color: var(--btn-fg);
             font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .primary[disabled] { opacity: .45; cursor: default; }
  .error { min-height: 20px; margin: 0 0 8px; font-size: 13px; color: #b3261e; }
  .foot { margin: 14px 0 0; font-size: 12px; color: var(--mute); }

  /* Result */
  .lead { margin: 0; font-size: 13px; font-weight: 600; }
  .size { margin: 2px 0 6px; font-size: clamp(72px, 26vw, 104px); line-height: .92; font-weight: 700; letter-spacing: -0.04em; }
  .why { margin: 0 0 20px; font-size: 15px; max-width: 34ch; }
  /* The tape: every size this product comes in, laid out like marks on a tape measure. The
     fill behind each mark is how likely that size is yours. */
  .tape { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; height: 76px; margin: 0 0 6px; border-bottom: 2px solid var(--ink);
          background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 10px); background-size: 100% 8px; background-repeat: no-repeat; background-position: 0 100%; }
  .tape div { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .tape i { display: block; width: 62%; background: var(--ink); min-height: 0; }
  .tape div.pick i { background: var(--ink); }
  .tape div:not(.pick) i { opacity: .28; }
  .tape span { position: absolute; top: 0; font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .chips { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 0 0 18px; }
  .chip { height: 40px; border: 0; background: none; color: inherit; font: inherit; font-size: 14px; cursor: pointer; border-radius: var(--radius); }
  .chip[aria-pressed="true"] { font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .chip.out { color: var(--mute); text-decoration: line-through; }
  .note { margin: 0 0 14px; font-size: 13px; padding: 10px 12px; background: var(--soft); border-radius: var(--radius); }
  .actions { display: grid; gap: 10px; }
  .secondary { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="closed">
<div class="scrim" id="scrim">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="title" id="card" tabindex="-1">
    <button class="close" id="close" type="button" aria-label="Close">&#x2715;</button>

    <form id="form" novalidate>
      <h1 id="title">Find your size</h1>
      <p class="product" id="product-line"></p>

      <fieldset>
        <legend>I shop for</legend>
        <div class="seg" id="gender">
          <label><input type="radio" name="gender" value="female">Women</label>
          <label><input type="radio" name="gender" value="male">Men</label>
        </div>
      </fieldset>

      <div class="row" id="metric-row">
        <div><label class="lab" for="h-cm">Height</label><div class="field"><input id="h-cm" inputmode="decimal" autocomplete="off"><span class="unit">cm</span></div></div>
        <div><label class="lab" for="w-kg">Weight</label><div class="field"><input id="w-kg" inputmode="decimal" autocomplete="off"><span class="unit">kg</span></div></div>
        <div><label class="lab" for="age">Age <span class="opt">optional</span></label><div class="field"><input id="age" inputmode="numeric" autocomplete="off"></div></div>
      </div>
      <div class="row" id="imperial-row" hidden>
        <div><label class="lab" for="h-ft">Height</label><div class="pair">
          <div class="field"><input id="h-ft" inputmode="numeric" autocomplete="off" aria-label="Feet"><span class="unit">ft</span></div>
          <div class="field"><input id="h-in" inputmode="numeric" autocomplete="off" aria-label="Inches"><span class="unit">in</span></div></div></div>
        <div><label class="lab" for="w-lb">Weight</label><div class="field"><input id="w-lb" inputmode="decimal" autocomplete="off"><span class="unit">lb</span></div></div>
        <div><label class="lab" for="age-i">Age <span class="opt">optional</span></label><div class="field"><input id="age-i" inputmode="numeric" autocomplete="off"></div></div>
      </div>
      <div class="units"><button type="button" class="link" id="units-toggle">Use feet and pounds</button></div>

      <div id="shape"></div>

      <fieldset>
        <legend>How I like it to fit</legend>
        <div class="seg">
          <label><input type="radio" name="fit" value="slim">Closer</label>
          <label><input type="radio" name="fit" value="regular" checked>Regular</label>
          <label><input type="radio" name="fit" value="loose">Looser</label>
        </div>
      </fieldset>

      <p class="error" id="error" role="alert"></p>
      <button class="primary" type="submit">Show my size</button>
      <p class="foot">Your answers stay on this device. No account, no photo.</p>
    </form>

    <section id="result" hidden>
      <p class="lead" id="result-lead">Your size</p>
      <p class="size" id="result-size"></p>
      <p class="why" id="result-why"></p>
      <div class="tape" id="tape" aria-hidden="true"></div>
      <div class="chips" id="chips" role="group" aria-label="Sizes"></div>
      <p class="note" id="result-note" hidden></p>
      <div class="actions">
        <button class="primary" type="button" id="add"></button>
        <div class="secondary">
          <button class="link" type="button" id="edit">Change my details</button>
          <button class="link" type="button" id="tryon" hidden>See it on your own body</button>
        </div>
      </div>
      <p class="foot" id="result-foot"></p>
    </section>
  </div>
</div>

<script type="module">
import { quickSize, validateInput, inferCategory, toMetric, SHAPE_QUESTIONS, ACCURACY, normalizeGender } from './size-estimator.js';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const inFrame = window.self !== window.top;
const STORE_KEY = 'tryon_size_profile_v1';

// ---- look: wear the store's colours, radius and font, never arbitrary CSS ----
const COLOR = /^(#[0-9a-f]{3,8}|rgba?\(\s*[\d.\s,%/]+\))$/i;
const setColor = (name, v) => { if (v && COLOR.test(v.trim())) document.documentElement.style.setProperty(name, v.trim()); };
setColor('--ink', q.get('ink')); setColor('--paper', q.get('paper'));
setColor('--btn-bg', q.get('btn_bg')); setColor('--btn-fg', q.get('btn_fg'));
// The store's button radius shapes the card's buttons as-is (a pill stays a pill); fields and
// the card itself take it capped, so a pill-button store does not get pill-shaped inputs.
const radius = parseFloat(q.get('radius'));
if (radius >= 0) {
  document.documentElement.style.setProperty('--btn-radius', Math.min(radius, 999) + 'px');
  document.documentElement.style.setProperty('--radius', Math.min(radius, 12) + 'px');
}
const font = (q.get('font') || '').replace(/[^\w\s,'"-]/g, '').slice(0, 200);
if (font) document.documentElement.style.setProperty('--font', font + ', system-ui, sans-serif');

// ---- config ----
const cfg = {
  api: q.get('api_url') ?? (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8000' : ''),
  shop: q.get('shop') || '',
  productId: q.get('product_id') || '',
  productName: q.get('product_name') || '',
  productType: q.get('product_type') || '',
  variantId: q.get('variant_id') || '',
  country: (q.get('country') || '').toUpperCase() || null,
};
let product = { sizes: [], hasTryon: false };   // from the host
let garment = null;                              // { category, fitType } once known
let silent = q.get('silent') === '1';
let sessionId = null;
let sessionPromise = null;
let last = null;                                 // last quickSize result
let picked = null;                               // size the shopper has selected
let units = ['US', 'LR', 'MM'].includes(cfg.country) ? 'imperial' : 'metric';

$('product-line').textContent = cfg.productName;
if (silent) document.body.classList.add('silent');

// ---- saved answers (this browser only) ----
function loadProfile() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { return null; } }
function saveProfile(p) { try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch { /* storage blocked: works for this visit */ } }
let profile = loadProfile();
if (profile && profile.units) units = profile.units;

// ---- host messaging ----
const post = (type, payload) => { if (inFrame) window.parent.postMessage(payload ? { type, payload } : { type }, '*'); };
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || !e.data) return;
  const d = e.data;
  if (d.type === 'TRYON_SIZE_PRODUCT' && d.payload) { product = normalizeProduct(d.payload); onProduct(); }
  if (d.type === 'TRYON_SIZE_OPEN') open();
  if (d.type === 'TRYON_SIZE_HIDE') hide(false);
});

function normalizeProduct(p) {
  const seen = new Set();
  const sizes = (p.sizes || []).map((s) => ({ label: String(s.label || '').trim(), available: s.available !== false }))
    .filter((s) => s.label && !seen.has(s.label.toLowerCase()) && seen.add(s.label.toLowerCase()));
  return { sizes, hasTryon: !!p.hasTryon };
}

// ---- what kind of garment is this? the store's 3D garment if it has one, else the product's own words ----
const garmentReady = (async () => {
  let category = inferCategory(cfg.productType, cfg.productName);
  let fitType = 'regular';
  let has3d = false;
  if (cfg.productId && cfg.shop) {
    try {
      const r = await fetch(`${cfg.api}/api/products/${encodeURIComponent(cfg.productId)}/tryon-config?shop=${encodeURIComponent(cfg.shop)}`);
      if (r.ok) { const d = await r.json(); category = d.category || category; fitType = d.fit_type || fitType; has3d = true; }
    } catch { /* offline or no garment: the product's own words are enough */ }
  }
  garment = { category, fitType, has3d };
})();

// ---- analytics: outcome only, never height / weight / age ----
function ensureSession() {
  if (!sessionPromise) {
    sessionPromise = fetch(cfg.api + '/api/events/tryon-session', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shop_domain: cfg.shop, product_id: cfg.productId, product_name: cfg.productName || undefined, variant_id: cfg.variantId || undefined }),
    }).then((r) => r.json()).then((d) => { sessionId = d.session_id || null; }).catch(() => {});
  }
  return sessionPromise;
}
async function track(eventType, metadata) {
  if (!cfg.shop) return;
  await ensureSession();
  fetch(cfg.api + '/api/events/track', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
    body: JSON.stringify({ event_type: eventType, session_id: sessionId || undefined, shop_domain: cfg.shop, product_id: cfg.productId,
      variant_id: cfg.variantId || undefined, country: undefined, preferred_fit: (profile && profile.fit) || undefined,
      metadata: { source: 'size_finder', ...(metadata || {}) } }),
  }).catch(() => {});
}

// ---- form ----
function renderShape(gender) {
  const saved = (profile && profile.gender === gender && profile.shape) || {};
  $('shape').innerHTML = SHAPE_QUESTIONS[gender].map((sq) => `
    <fieldset>
      <legend>${sq.label} <span class="opt">for my height and weight</span></legend>
      <div class="seg">${sq.options.map((o, i) => `<label><input type="radio" name="shape-${sq.id}" value="${i - 1}"${(saved[sq.id] ?? 0) === i - 1 ? ' checked' : ''}>${o}</label>`).join('')}</div>
    </fieldset>`).join('');
}
function setUnits(u) {
  units = u;
  $('metric-row').hidden = u !== 'metric';
  $('imperial-row').hidden = u !== 'imperial';
  $('units-toggle').textContent = u === 'metric' ? 'Use feet and pounds' : 'Use centimetres and kilograms';
}
function fillForm() {
  const g = (profile && profile.gender) || null;
  document.querySelectorAll('input[name=gender]').forEach((r) => { r.checked = r.value === g; });
  renderShape(g || 'female');
  $('shape').hidden = !g;
  if (profile) {
    if (profile.height) { $('h-cm').value = profile.height; const totalIn = profile.height / 2.54; $('h-ft').value = Math.floor(totalIn / 12); $('h-in').value = Math.round(totalIn % 12); }
    if (profile.weight) { $('w-kg').value = profile.weight; $('w-lb').value = Math.round(profile.weight / 0.45359237); }
    if (profile.age) { $('age').value = profile.age; $('age-i').value = profile.age; }
    document.querySelectorAll('input[name=fit]').forEach((r) => { r.checked = r.value === (profile.fit || 'regular'); });
  }
  setUnits(units);
}
$('gender').addEventListener('change', (e) => { renderShape(e.target.value); $('shape').hidden = false; });
$('units-toggle').addEventListener('click', () => setUnits(units === 'metric' ? 'imperial' : 'metric'));
$('form').addEventListener('input', () => { $('error').textContent = ''; });

function readForm() {
  const gender = (document.querySelector('input[name=gender]:checked') || {}).value;
  const m = units === 'imperial' ? toMetric('imperial', $('h-ft').value, $('h-in').value, $('w-lb').value) : toMetric('metric', $('h-cm').value, null, $('w-kg').value);
  const age = (units === 'imperial' ? $('age-i').value : $('age').value).trim();
  const shape = {};
  if (gender) for (const sq of SHAPE_QUESTIONS[gender]) { const c = document.querySelector(`input[name="shape-${sq.id}"]:checked`); shape[sq.id] = c ? Number(c.value) : 0; }
  return { gender, height: m.height, weight: m.weight, age: age === '' ? null : Number(age), shape,
           fit: (document.querySelector('input[name=fit]:checked') || {}).value || 'regular', units };
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = readForm();
  const err = !p.gender ? 'Choose Women or Men.' : validateInput(p);
  if (err) { $('error').textContent = err; return; }
  profile = p; saveProfile(p);
  await showResult(true);
});

// ---- result ----
function compute() {
  if (!profile || !product.sizes.length || !garment) return null;
  return quickSize(
    { gender: profile.gender, height: profile.height, weight: profile.weight, age: profile.age, shape: profile.shape },
    { sizes: product.sizes.map((s) => s.label), category: garment.category, fitType: garment.fitType },
    { preferredFit: profile.fit, country: cfg.country },
  );
}
const up = (s) => String(s).toUpperCase();
const isOut = (label) => { const s = product.sizes.find((x) => x.label === label); return !!s && !s.available; };

async function showResult(fresh) {
  await garmentReady;
  last = compute();
  if (!last) { showForm(); if (profile && !product.sizes.length) $('error').textContent = 'This product has no sizes to choose from.'; return; }
  post('TRYON_SIZE_RESULT', { size: last.recommendedSize, alternative: last.alternative });
  if (silent) return;

  // If the recommended size is sold out, start on the other likely size when that one is in stock.
  picked = last.recommendedSize;
  let note = '';
  if (isOut(picked)) {
    if (last.alternative && !isOut(last.alternative)) { note = `${up(picked)} is sold out. ${up(last.alternative)} is your next most likely size.`; picked = last.alternative; }
    else note = `${up(picked)} is sold out right now.`;
  } else if (last.alternative && isOut(last.alternative)) {
    note = `${up(last.alternative)} is sold out right now.`;
  }
  if (garment.fitType === 'oversized') note = (note ? note + ' ' : '') + 'This piece is cut oversized on purpose, so your usual size already fits loose.';
  if (garment.fitType === 'slim') note = (note ? note + ' ' : '') + 'This piece is cut slim.';

  $('result-size').textContent = up(last.recommendedSize);
  $('result-why').textContent = last.reasoning;
  $('result-note').textContent = note; $('result-note').hidden = !note;
  const byLabel = Object.fromEntries(last.probabilities.map((x) => [x.size, x.p]));
  const top = Math.max(...last.probabilities.map((x) => x.p));
  $('tape').innerHTML = product.sizes.map((s) => {
    const p = byLabel[s.label] || 0;
    return `<div class="${s.label === last.recommendedSize ? 'pick' : ''}">${p >= 0.05 ? `<span>${Math.round(p * 100)}%</span>` : ''}<i style="height:${p ? Math.max(6, Math.round((p / top) * 70)) : 0}%"></i></div>`;
  }).join('');
  renderChips();
  const acc = ACCURACY[normalizeGender(profile.gender)] || ACCURACY.female;
  const a = acc[last.anchor] || acc.chest;
  $('result-foot').textContent = `Estimated from your height, weight and build, not measured. Estimates like this match a tape measure about ${Math.round(a[0] * 10)} times in 10 and are within one size nearly every time.`;
  $('tryon').hidden = !(product.hasTryon && garment.has3d);
  $('form').hidden = true; $('result').hidden = false;
  $('card').scrollTop = 0;
  if (fresh) {
    track('size_finder_completed', { size: last.recommendedSize, confidence: last.confidence, alternative: last.alternative, extrapolated: last.extrapolated, used_age: profile.age != null });
    track('size_recommended', { size: String(last.recommendedSize).toLowerCase(), confidence: last.confidence });
  }
}
function renderChips() {
  $('chips').innerHTML = product.sizes.map((s) =>
    `<button type="button" class="chip${s.available ? '' : ' out'}" data-size="${encodeURIComponent(s.label)}" aria-pressed="${s.label === picked}"${s.available ? '' : ' aria-label="' + up(s.label) + ', sold out"'}>${up(s.label)}</button>`).join('');
  const out = isOut(picked);
  $('add').textContent = out ? `${up(picked)} is sold out` : `Add ${up(picked)} to cart`;
  $('add').disabled = out;
}
$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  picked = decodeURIComponent(b.dataset.size); renderChips();
  track('size_selected', { size: picked.toLowerCase() });
});
$('add').addEventListener('click', () => {
  if (!picked || isOut(picked)) return;
  track('add_to_cart', { size: picked.toLowerCase(), recommended: String(last.recommendedSize).toLowerCase() });
  post('TRYON_SIZE_ADD_TO_CART', { size: picked, session_id: sessionId });
  hide(true);
});
$('edit').addEventListener('click', showForm);
$('tryon').addEventListener('click', () => { post('TRYON_SIZE_OPEN_TRYON'); hide(true); });

function showForm() { fillForm(); $('result').hidden = true; $('form').hidden = false; $('card').scrollTop = 0; }

// ---- open / close ----
async function open() {
  silent = false;
  document.body.classList.remove('silent', 'closed');
  track('size_finder_opened');
  if (profile && !validateInput(profile) && profile.gender) await showResult(true); else showForm();
  $('card').focus({ preventScroll: true });
}
function hide(tellHost) {
  document.body.classList.add('closed');
  if (tellHost) post('TRYON_SIZE_CLOSE');
}
async function onProduct() {
  // A returning shopper gets their size for this product without opening anything.
  if (document.body.classList.contains('closed') || silent) {
    await garmentReady;
    const r = profile && profile.gender && !validateInput(profile) ? compute() : null;
    if (r) post('TRYON_SIZE_RESULT', { size: r.recommendedSize, alternative: r.alternative });
  } else if (!$('result').hidden) {
    await showResult(false);
  }
}
$('close').addEventListener('click', () => hide(true));
$('scrim').addEventListener('click', (e) => { if (e.target === $('scrim')) hide(true); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(true); });

// ---- start ----
fillForm();
if (inFrame) {
  post('TRYON_SIZE_READY');
} else {
  // Opened directly (local preview): stand in for the store.
  product = normalizeProduct({ sizes: (q.get('sizes') || 'S,M,L,XL').split(',').map((label) => ({ label, available: !(q.get('sold_out') || '').split(',').includes(label) })), hasTryon: q.get('tryon') === '1' });
  open();
}
</script>
</body>
