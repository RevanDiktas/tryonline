<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TryOn Embedded Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #canvas-container { width: 100%; height: 100%; }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: system-ui; font-size: 14px; color: #666; }
    .loading.hidden { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="loading" class="loading">Loading...</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /**
     * Demo viewer: test@gmail.com avatar + Blanc Ramin zipup draped onto that body.
     * Mirrors the iframe test-viewer render path: PMREM env, FLOOR_Y anchor,
     * CLO defense guards. Size selection via URL hash (#s, #m, #l).
     */
    const AVATAR_URL = 'https://cykwthsbrylonconqlfz.supabase.co/storage/v1/object/public/avatars/aa6d2670-4e41-4de7-9450-07d487825644/avatar_textured.glb';
    const DRAPE_BASE = 'https://cykwthsbrylonconqlfz.supabase.co/storage/v1/object/public/garments/draped/769981ba-37bc-429b-89c8-068d19503f83/c06b18d9337a44dc:v45.3:v45.12';
    const BODY_HASH = '6301199c3bb5bdc8';

    const garmentUrls = {
      s: `${DRAPE_BASE}/s/${BODY_HASH}.glb`,
      m: `${DRAPE_BASE}/m/${BODY_HASH}.glb`,
      l: `${DRAPE_BASE}/l/${BODY_HASH}.glb`,
    };

    const TARGET_HEIGHT = 1.8;
    const FLOOR_Y = -0.9;

    const container = document.getElementById('canvas-container');
    const loading = document.getElementById('loading');

    function geometryWorldBounds(root) {
      const box = new THREE.Box3();
      root.updateMatrixWorld(true);
      root.traverse((c) => {
        if (!c.isMesh || !c.geometry) return;
        const g = c.geometry;
        if (!g.boundingBox) g.computeBoundingBox();
        if (!g.boundingBox || g.boundingBox.isEmpty()) return;
        const b = g.boundingBox.clone();
        b.applyMatrix4(c.matrixWorld);
        box.union(b);
      });
      return box;
    }

    function metersScaleFor(root) {
      const box = geometryWorldBounds(root);
      if (box.isEmpty()) return 1;
      const size = box.getSize(new THREE.Vector3());
      return size.y > 100 ? 0.001 : 1;
    }

    function refreshSkinnedMeshes(root) {
      root.updateMatrixWorld(true);
      root.traverse((o) => {
        if (o.isSkinnedMesh && o.skeleton) o.skeleton.update();
      });
    }

    function resetSkinnedBindPose(root) {
      root.traverse((o) => {
        if (o.isSkinnedMesh && o.skeleton && typeof o.skeleton.pose === 'function') {
          o.skeleton.pose();
        }
      });
    }

    function fixDegenerateNodeScales(root) {
      const pos = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scl = new THREE.Vector3();
      root.updateMatrixWorld(true);
      root.traverse((o) => {
        if (o.isBone) return;
        o.matrixAutoUpdate = true;
        o.matrixWorld.decompose(pos, quat, scl);
        const m = Math.max(Math.abs(scl.x), Math.abs(scl.y), Math.abs(scl.z));
        if (m < 1e-6) {
          o.scale.set(1, 1, 1);
          o.updateMatrix();
        }
      });
      root.updateMatrixWorld(true);
    }

    function detachFromParent(obj) {
      if (!obj) return;
      if (typeof obj.removeFromParent === 'function') obj.removeFromParent();
      else if (obj.parent) obj.parent.remove(obj);
    }

    function prepareGarment(scene) {
      scene.traverse((child) => {
        if (!child.isMesh) return;
        child.visible = true;
        child.frustumCulled = false;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach((m) => {
          if (!m) return;
          m.side = THREE.DoubleSide;
          if (typeof m.opacity === 'number' && m.opacity < 0.01) m.opacity = 1;
        });
      });
    }

    const getSize = () => {
      const hash = window.location.hash.slice(1).toLowerCase();
      return ['s', 'm', 'l'].includes(hash) ? hash : 'm';
    };

    const gltfLoader = new GLTFLoader();
    const garmentCache = {};
    let avatarCache = null;
    let currentSize = getSize();
    let currentModel = null;
    let scene, camera, renderer, controls;

    function initScene() {
      scene = new THREE.Scene();

      const aspect = container.clientWidth / container.clientHeight;
      const isMobileView = window.innerWidth <= 768;
      const fov = isMobileView ? 36 : 30;
      camera = new THREE.PerspectiveCamera(fov, aspect, 0.1, 100);
      camera.position.set(0, 0.05, isMobileView ? 4.6 : 3.6);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false });
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      if (THREE.ColorManagement) THREE.ColorManagement.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      container.appendChild(renderer.domElement);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.enableRotate = true;
      controls.panSpeed = 1.5;
      controls.rotateSpeed = 1.2;
      controls.zoomSpeed = 2.0;
      controls.minDistance = 1.5;
      controls.maxDistance = 10;
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.update();

      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
      keyLight.position.set(5, 5, 5);
      scene.add(keyLight);
      const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);
      fillLight.position.set(-3, 3, -3);
      scene.add(fillLight);
    }

    function loadAvatar() {
      return new Promise((resolve) => {
        gltfLoader.load(AVATAR_URL, (gltf) => { avatarCache = gltf.scene; resolve(); },
          undefined, (err) => { console.error('[embed-viewer] Avatar load failed:', err); resolve(); });
      });
    }

    function preloadGarments() {
      const entries = Object.entries(garmentUrls);
      entries.forEach(([size, url]) => {
        gltfLoader.load(url, (gltf) => {
          garmentCache[size] = gltf.scene;
          if (size === currentSize) showModel(currentSize);
        }, undefined, (err) => {
          console.error('[embed-viewer] Garment load failed:', size, err);
        });
      });
    }

    function showModel(size) {
      const key = size.toLowerCase();
      if (!avatarCache || !garmentCache[key]) {
        loading.classList.remove('hidden');
        return;
      }
      loading.classList.add('hidden');
      displayModel(key);
    }

    function displayModel(key) {
      if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
      }
      const group = new THREE.Group();

      detachFromParent(avatarCache);
      avatarCache.position.set(0, 0, 0);
      avatarCache.rotation.set(0, 0, 0);
      avatarCache.scale.set(1, 1, 1);
      refreshSkinnedMeshes(avatarCache);
      avatarCache.scale.setScalar(metersScaleFor(avatarCache));
      refreshSkinnedMeshes(avatarCache);
      group.add(avatarCache);

      const garmentRoot = garmentCache[key];
      detachFromParent(garmentRoot);
      garmentRoot.position.set(0, 0, 0);
      garmentRoot.rotation.set(0, 0, 0);
      garmentRoot.scale.set(1, 1, 1);
      resetSkinnedBindPose(garmentRoot);
      refreshSkinnedMeshes(garmentRoot);
      fixDegenerateNodeScales(garmentRoot);
      garmentRoot.scale.setScalar(metersScaleFor(garmentRoot));
      refreshSkinnedMeshes(garmentRoot);
      prepareGarment(garmentRoot);
      group.add(garmentRoot);
      group.updateMatrixWorld(true);

      currentModel = group;
      currentModel.scale.setScalar(1);
      currentModel.position.set(0, 0, 0);
      currentModel.updateMatrixWorld(true);
      const combined = geometryWorldBounds(currentModel);
      if (!combined.isEmpty()) {
        const size = combined.getSize(new THREE.Vector3());
        const center = combined.getCenter(new THREE.Vector3());
        const scale = size.y > 1e-9 ? TARGET_HEIGHT / size.y : 1;
        currentModel.scale.setScalar(scale);
        currentModel.position.set(
          -center.x * scale,
          FLOOR_Y - combined.min.y * scale,
          -center.z * scale,
        );
      }

      scene.add(currentModel);
      currentModel.updateMatrixWorld(true);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      if (!renderer) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    window.addEventListener('hashchange', () => {
      currentSize = getSize();
      showModel(currentSize);
    });
    window.addEventListener('resize', onResize);

    initScene();
    animate();
    loadAvatar().then(() => {
      preloadGarments();
    });
  </script>
</body>
</html>
