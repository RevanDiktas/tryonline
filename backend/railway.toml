# Railway backend service
# In Railway dashboard: set Root Directory to "backend" for this service.
# This file is used when Root Directory = backend (path from repo root: backend/railway.toml).

[build]
builder = "dockerfile"
# dockerfilePath intentionally NOT set: with rootDirectory=backend, Railway
# resolves dockerfilePath from the REPO ROOT (not the rootDirectory), so
# `dockerfilePath = "Dockerfile"` made it pick up the legacy /Dockerfile
# that uses `COPY backend/...` paths which don't exist when the build
# context is just `backend/`. Letting Railway auto-detect picks up
# backend/Dockerfile, which uses `COPY . .` correctly.

[deploy]
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
