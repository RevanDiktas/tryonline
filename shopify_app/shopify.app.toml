# Tryon (tryon-3) — Public App Store app
# Deploy: cd shopify_app && shopify app deploy (or npm run deploy)
name = "Tryon"
client_id = "ec47b40d60204a8d7cf80aa50e313d19"
application_url = "https://tryon.global/app"
embedded = true
handle = "tryon"

[access_scopes]
scopes = "read_orders"

[access.admin]
direct_api_mode = "online"

[auth]
redirect_urls = [
  "https://heroic-celebration-production-9f72.up.railway.app/api/shopify/auth/callback",
  "https://tryon.global/app",
]

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://heroic-celebration-production-9f72.up.railway.app/api/webhooks/shopify/compliance"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
