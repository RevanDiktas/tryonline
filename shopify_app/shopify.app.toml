# Tryon (tryon-3) — from clone + compliance webhook for App Store
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ec47b40d60204a8d7cf80aa50e313d19"
name = "Tryon"
application_url = "https://app.tryon.global/app"
embedded = true

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://heroic-celebration-production-9f72.up.railway.app/api/webhooks/shopify/compliance"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "https://heroic-celebration-production-9f72.up.railway.app/api/webhooks/shopify/orders-paid"

[[webhooks.subscriptions]]
topics = ["refunds/create"]
uri = "https://heroic-celebration-production-9f72.up.railway.app/api/webhooks/shopify/refunds-created"

[access_scopes]
scopes = "read_orders"
optional_scopes = []
use_legacy_install_flow = false

# So embedded app can use fetch('shopify:admin/api/...') with automatic session token (for App Store check)
[access.admin]
direct_api_mode = "online"

[auth]
redirect_urls = [
  "https://heroic-celebration-production-9f72.up.railway.app/api/shopify/auth/callback",
  "https://app.tryon.global/app"
]

[pos]
embedded = false
