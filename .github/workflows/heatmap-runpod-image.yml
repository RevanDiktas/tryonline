# Build heatmap RunPod worker on GitHub-hosted runners and push to GHCR.
# Use this when RunPod "Build from GitHub" dies right after clone (no Docker steps in UI).
#
# After push: RunPod → New/Edit endpoint → deploy from container registry:
#   ghcr.io/<owner-lowercase>/tryonline-heatmap:latest
#
# Repo may need: Settings → Actions → General → Workflow permissions → Read and write packages.

name: heatmap-runpod Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/heatmap
      - feature/warp-heatmap-worker
      - feature/warpheatmap
    paths:
      - "heatmap-runpod/**"
      - "heatmap-worker/**"
      - ".github/workflows/heatmap-runpod-image.yml"

concurrency:
  group: heatmap-runpod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR must be lowercase)
        id: n
        run: |
          o="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${o}/tryonline-heatmap" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: heatmap-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.n.outputs.image }}:latest
            ${{ steps.n.outputs.image }}:${{ github.sha }}

  # Tiny image (~1 min) — proves GHCR + RunPod registry deploy works even when full Warp build fails.
  build-minimal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR must be lowercase)
        id: n
        run: |
          o="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${o}/tryonline-heatmap-minimal" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: heatmap-runpod/Dockerfile.minimal
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.n.outputs.image }}:latest
            ${{ steps.n.outputs.image }}:${{ github.sha }}
